<div class="ok-veil" role="status" aria-live="polite" (click)="fechar()">
  <div class="ok-card">
    <div class="ok-seal">
      <svg class="ok-ring" viewBox="0 0 96 96" aria-hidden="true">
        <circle cx="48" cy="48" r="46"/>
      </svg>
      <img src="assets/logo.png" alt="Farias Troca de Óleo">
      <div class="oil-drop" aria-hidden="true" style="top:2px;left:calc(50% - 9px)">
        <svg width="18" height="24" viewBox="0 0 24 32" fill="currentColor">
          <path d="M12 2 C12 2, 3 14, 3 21 C3 26 7 30 12 30 C17 30 21 26 21 21 C21 14, 12 2, 12 2 Z"/>
        </svg>
      </div>
      <span class="ok-check" aria-hidden="true">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#fff"
             stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.5 8.5 6.5 11.5 12.5 5"/>
        </svg>
      </span>
    </div>
    <h3>{{ titulo() }}</h3>
    @if (linha()) { <p>{{ linha() }}</p> }
    @if (valor()) { <p class="ok-val">{{ valor() }}</p> }
    @if (meta()) { <p class="ok-meta">{{ meta() }}</p> }
  </div>
</div>
